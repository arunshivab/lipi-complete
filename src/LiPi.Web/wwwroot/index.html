<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiPi - HIPAA Compliant Healthcare Information System</title>
    <base href="/" />
    <meta name="description" content="LiPi: Enterprise multi-tenant SaaS Hospital Information System (HIS) with HIPAA, DPDP, ABDM, and Six Sigma compliance.">
    <meta name="theme-color" content="#0B2545">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230B2545' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>L</text></svg>">
    <!-- LiPi Sans + LiPi Mono — self-hosted, no CDN (HIPAA/DPDP compliance) -->
    <link rel="preload" href="/lipi-sans/fonts/LiPi-Sans-Latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/lipi-sans/fonts/LiPi-Mono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/lipi-sans/lipi-sans.css">
    <link rel="stylesheet" href="css/app.css" />
    <style>
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid rgba(11, 37, 69, 0.15);
            border-top-color: #0B2545;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-spinner"></div>
    </div>
    <script src="_framework/blazor.web.js"></script>
</body>
</html>
